name: Auto dependency update

on:
  schedule:
    - cron: '0 3 * * *'  # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-tools (for safe updates)
        run: python -m pip install --upgrade pip pip-tools

      - name: Upgrade pinned requirements
        run: |
          if [ -f ./flipper-pineapple-manager/requirements.txt ]; then
            pushd flipper-pineapple-manager
            python -m pip install --upgrade -r requirements.txt
            python -m pip freeze > requirements.txt.new
            if ! git diff --quiet -- requirements.txt.new; then
              mv requirements.txt.new requirements.txt
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git checkout -b auto/deps-update-${{ github.run_id }} || true
              git add requirements.txt
              git commit -m "chore: bump pinned dependencies (auto)" || true
              git push --set-upstream origin HEAD
            else
              echo "No dependency updates"
            fi
            popd
          else
            echo "No requirements.txt found, exiting"
            exit 0
          fi

      - name: Create Pull Request
        if: steps.update-deps.outputs.changed == 'true' || always()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump pinned dependencies (auto)"
          branch: "auto/deps-update-${{ github.run_id }}"
          title: "chore: automatic dependency updates"
          body: |
            This PR was created automatically by a scheduled GitHub Action to upgrade pinned dependencies in `flipper-pineapple-manager/requirements.txt`.

            Please review and test before merging.
          labels: automatic-deps
