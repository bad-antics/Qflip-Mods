name: Safe dependency update (draft PR)

on:
  schedule:
    - cron: '0 4 1 * *'  # Monthly at 04:00 UTC on day 1
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install tools
        run: python -m pip install --upgrade pip pip-tools

      - name: Generate updated requirements
        run: |
          pushd flipper-pineapple-manager
          python -m pip install --upgrade -r requirements.txt || true
          python -m pip freeze > requirements.txt.new
          if diff -u requirements.txt requirements.txt.new >/dev/null 2>&1; then
            echo "No updates"
            exit 0
          fi
          mv requirements.txt.new requirements.txt
          popd

      - name: Run conflict check
        run: |
          pushd flipper-pineapple-manager
          python -m pip install -r requirements.txt
          python -m pip check || echo "pip check reported issues; maintainers should review"
          popd

      - name: Run tests (if present)
        run: |
          if [ -d "flipper-pineapple-manager/tests" ]; then
            pushd flipper-pineapple-manager
            python -m pip install -r requirements.txt
            if command -v pytest >/dev/null 2>&1; then
              pytest -q || echo "Tests failed; review required"
            else
              echo "No pytest available; consider adding tests"
            fi
            popd
          else
            echo "No tests detected; skipping test step"
          fi

      - name: Create Draft Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): safe monthly update (draft)"
          branch: "auto/safe-deps-update-${{ github.run_id }}"
          title: "chore(deps): safe monthly update (draft)"
          body: |
            This draft PR contains proposed dependency updates generated by an automated monthly workflow. It is intentionally created as a DRAFT so maintainers can review changes, run the full test suite, and merge when ready.

            Actions performed automatically:
            - Upgraded installed packages and re-pinned `requirements.txt` via `pip freeze`.
            - Ran `python -m pip check` to detect conflicts.
            - Ran tests if a `tests/` directory exists and `pytest` is available.

            Please review and test before merging.
          labels: "auto-deps-draft"
          draft: true
